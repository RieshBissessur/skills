name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the pipeline
        run: python3 scripts/pipeline_check.py

      - name: Verify the native pre-commit hook
        run: bash scripts/verify_hook.sh
